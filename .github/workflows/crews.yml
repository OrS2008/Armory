name: Lay out a post's crews

# Who stands חפ״ק together is personnel data: it changes when somebody moves,
# and it has no business in a file under version control. So the roster arrives
# as an input, is matched against the names the personnel table already holds,
# and is never written into the repository.
#
# The same thing can be done from the app — סוגי משימות ← עוד ← סבבים קבועים.
# This exists for laying one out in bulk, and for reading back what matched.
on:
  workflow_dispatch:
    inputs:
      crews_json:
        description: '{"post":"חפ\"ק","crews":[{"name":"סבב א׳","members":[{"person":"...","seat":"CMD"}]}]}'
        type: string
        required: true
      apply:
        description: Write the crews. Leave off to only report who was matched.
        type: boolean
        default: false
      database_name:
        description: D1 database name
        type: string
        default: shabatzak

concurrency:
  group: crews
  cancel-in-progress: false

jobs:
  crews:
    name: Match, then lay out
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: ${{ inputs.database_name }}
      CREWS_JSON: ${{ inputs.crews_json }}
    steps:
      - name: Check that the credentials are present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings, Secrets and variables, Actions. The token needs Account, D1, Edit.'
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm clean-install

      # Always printed. A name the roster cannot match is a crew member who
      # would be silently dropped, and that has to be seen before it happens.
      - name: Which of the named people the roster has
        run: |
          node scripts/crew-check.mjs > /tmp/check.sql
          cat /tmp/check.sql
          npx wrangler d1 execute "$DATABASE_NAME" --remote --file=/tmp/check.sql

      - name: The crews as they stand now
        run: |
          npx wrangler d1 execute "$DATABASE_NAME" --remote --command "
            SELECT t.name AS post, c.name AS crew, c.position, p.display_name AS member,
                   q.name AS seat
              FROM assignment_type_crews c
              JOIN assignment_types t ON t.id = c.assignment_type_id
              LEFT JOIN assignment_type_crew_members m ON m.crew_id = c.id
              LEFT JOIN personnel p ON p.id = m.personnel_id
              LEFT JOIN qualifications q ON q.id = m.role_qualification_id
             ORDER BY t.name, c.position, q.name;"

      - name: Lay them out
        if: ${{ inputs.apply }}
        run: |
          node scripts/crew-sql.mjs > /tmp/crews.sql
          npx wrangler d1 execute "$DATABASE_NAME" --remote --file=/tmp/crews.sql

      - name: What the post carries now
        if: ${{ inputs.apply }}
        run: |
          npx wrangler d1 execute "$DATABASE_NAME" --remote --command "
            SELECT t.name AS post, c.name AS crew, c.position, p.display_name AS member,
                   q.name AS seat
              FROM assignment_type_crews c
              JOIN assignment_types t ON t.id = c.assignment_type_id
              LEFT JOIN assignment_type_crew_members m ON m.crew_id = c.id
              LEFT JOIN personnel p ON p.id = m.personnel_id
              LEFT JOIN qualifications q ON q.id = m.role_qualification_id
             ORDER BY t.name, c.position, q.name;"
