name: Ask production a question

# Reading the live database was possible only by editing whichever workflow
# happened to be nearest and pushing it, which puts a commit in the history for
# every question and gets the question wrong twice before it is right.
#
# This asks. It reads and never writes: the statement is checked to be a single
# SELECT before wrangler sees it, so a mistyped question cannot become a
# mistyped change. Anything that alters data goes through a workflow that says
# so in its name and reports before it writes.
on:
  workflow_dispatch:
    inputs:
      sql:
        description: One SELECT statement. Reads only.
        type: string
        required: true
      database_name:
        description: D1 database name
        type: string
        default: shabatzak

concurrency:
  group: query
  cancel-in-progress: false

jobs:
  ask:
    name: Read
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: ${{ inputs.database_name }}
      SQL: ${{ inputs.sql }}
    steps:
      - name: Check that the credentials are present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings, Secrets and variables, Actions.'
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm clean-install

      # Refused before it reaches the database rather than after, because "it
      # only ever gets SELECTs" is a habit and this is a rule.
      - name: Check it is a question, not a change
        run: node scripts/read-only-sql.mjs

      - name: Ask
        run: |
          npx wrangler d1 execute "$DATABASE_NAME" --remote --command "$SQL"
