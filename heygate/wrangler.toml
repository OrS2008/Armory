name = "heygate"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# KV namespace (created with: npx wrangler kv namespace create HEYGATE)
[[kv_namespaces]]
binding = "GATE"
id = "6f1ad79be7264720845f361cc9e9d48d"

# Secrets (never put them here) — set with `npx wrangler secret put <NAME>`:
#   ENC_KEY      32 random bytes (base64url): master key, per-customer keys derive from it
#   SETUP_CODE   one-time code that creates the super-admin account at /sa

# Cloudflare's built-in rate limiting (per IP, per Cloudflare location, no KV writes).
[[ratelimits]]
name = "RL_PUBLIC" # /o, /arm, /car
namespace_id = "7101"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_ADMIN" # everything under /admin
namespace_id = "7102"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_AUTH" # login, setup and pairing attempts
namespace_id = "7103"
simple = { limit = 10, period = 60 }
