name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: shabatzak
      DATABASE_NAME: shabatzak
    steps:
      - name: Check that the credentials are present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions, then run Provision Cloudflare once."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm clean-install

      - name: Typecheck, lint and test
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build
        run: npm run build

      # The repository stores a placeholder database id on purpose, so no
      # deploy can reach an unintended database. The real id is resolved from
      # the account here and substituted for this run only.
      - name: Point wrangler.toml at the real database
        run: |
          set -euo pipefail
          id=$(npx wrangler d1 list --json \
            | jq -r --arg name "$DATABASE_NAME" '.[] | select(.name == $name) | (.uuid // .database_id)' \
            | head -n1)
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::No D1 database named $DATABASE_NAME. Run the Provision Cloudflare workflow first."
            exit 1
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.toml

      # Migrations are additive and idempotent; wrangler applies only the ones
      # the target database has not seen yet.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$DATABASE_NAME" --remote

      - name: Deploy
        run: npx wrangler pages deploy dist --project-name="$PROJECT_NAME" --branch=main

      - name: Smoke test the deployment
        run: |
          set -euo pipefail
          url="https://$PROJECT_NAME.pages.dev/api/v1/health"
          for attempt in $(seq 1 12); do
            body=$(curl -fsS --max-time 20 "$url" || true)
            if echo "$body" | grep -q '"status":"ready"'; then
              echo "Healthy: $body"
              echo "https://$PROJECT_NAME.pages.dev — healthy" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: not ready yet ($body)"
            sleep 10
          done
          echo "::error::The deployment did not report a healthy database."
          exit 1
