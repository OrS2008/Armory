name = "shabatzak"
compatibility_date = "2026-08-01"
pages_build_output_dir = "./dist"

# Cloudflare Pages reads this file and it takes precedence over the dashboard's
# binding settings, so `database_id` must be the real database once the project
# is connected to Git. Until then the all-zeros placeholder keeps any stray
# wrangler command from reaching a real database.
# See docs/12-deployment-plan.md.
[[d1_databases]]
binding = "DB"
database_name = "shabatzak"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
