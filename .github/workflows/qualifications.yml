name: Tidy the marks

# A mark can be created from the app and edited there, and until now could
# never be removed — so a typo, or a second copy of something that already
# existed, stayed on the list for good. Three of the company's marks were
# typed in by hand beside seeded ones that mean the same thing.
#
# Removing one is not a delete: people hold it, posts require it, posts refuse
# it, and shifts already stood record it as the seat somebody filled. Merging
# moves all four onto the mark that stays, so nobody loses a qualification and
# no post loses its requirement. This reports before it moves anything.
on:
  workflow_dispatch:
    inputs:
      merge_from:
        description: 'Mark to retire (id or code). Empty means report only.'
        type: string
        default: ''
      merge_into:
        description: 'Mark it is merged into (id or code). Required with merge_from.'
        type: string
        default: ''
      database_name:
        description: D1 database name
        type: string
        default: shabatzak

concurrency:
  group: qualifications
  cancel-in-progress: false

jobs:
  tidy:
    name: Report, then merge
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: ${{ inputs.database_name }}
      MERGE_FROM: ${{ inputs.merge_from }}
      MERGE_INTO: ${{ inputs.merge_into }}
    steps:
      - name: Check that the credentials are present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings, Secrets and variables, Actions. The token needs Account, D1, Edit.'
            exit 1
          fi
          if [ -n "$MERGE_FROM" ] && [ -z "$MERGE_INTO" ]; then
            echo '::error::merge_from without merge_into would delete a mark and everyone who holds it. Name the mark it merges into.'
            exit 1
          fi
          if [ -n "$MERGE_FROM" ] && [ "$MERGE_FROM" = "$MERGE_INTO" ]; then
            echo '::error::A mark cannot be merged into itself.'
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm clean-install

      # Always printed. What a mark costs to remove is what is attached to it.
      - name: Every mark, and what is attached to it
        run: |
          npx wrangler d1 execute "$DATABASE_NAME" --remote --command "
            SELECT q.id, q.code, q.name, q.active, q.exclusive, q.blocks_scheduling,
                   (SELECT COUNT(*) FROM personnel_qualifications pq
                     WHERE pq.qualification_id = q.id)            AS held_by,
                   (SELECT COUNT(*) FROM assignment_type_qualifications tq
                     WHERE tq.qualification_id = q.id)            AS required_by,
                   (SELECT COUNT(*) FROM assignment_type_exclusions te
                     WHERE te.qualification_id = q.id)            AS excluded_by,
                   (SELECT COUNT(*) FROM assignment_personnel ap
                     WHERE ap.role_qualification_id = q.id)       AS seats_recorded
              FROM qualifications q
             ORDER BY q.name, q.code;"

      # Two rows meaning the same thing is the case this workflow exists for.
      - name: Marks sharing a name
        run: |
          npx wrangler d1 execute "$DATABASE_NAME" --remote --command "
            SELECT name, COUNT(*) AS copies, GROUP_CONCAT(code) AS codes,
                   GROUP_CONCAT(id) AS ids
              FROM qualifications
             GROUP BY name HAVING COUNT(*) > 1;"

      - name: Who holds the mark being retired
        if: ${{ inputs.merge_from != '' }}
        run: |
          npx wrangler d1 execute "$DATABASE_NAME" --remote --command "
            SELECT p.display_name AS person
              FROM personnel_qualifications pq
              JOIN personnel p ON p.id = pq.personnel_id
              JOIN qualifications q ON q.id = pq.qualification_id
             WHERE q.id = '$MERGE_FROM' OR q.code = '$MERGE_FROM'
             ORDER BY p.display_name;"

      # Each move is INSERT OR IGNORE first, then DELETE what is left: somebody
      # holding both marks already must end up holding the survivor once, not
      # fail the merge on a unique key.
      - name: Move everything onto the mark that stays
        if: ${{ inputs.merge_from != '' }}
        run: |
          npx wrangler d1 execute "$DATABASE_NAME" --remote --command "
            INSERT OR IGNORE INTO personnel_qualifications (personnel_id, qualification_id, granted_at, expires_at)
              SELECT pq.personnel_id, (SELECT id FROM qualifications WHERE id='$MERGE_INTO' OR code='$MERGE_INTO'),
                     pq.granted_at, pq.expires_at
                FROM personnel_qualifications pq
               WHERE pq.qualification_id = (SELECT id FROM qualifications WHERE id='$MERGE_FROM' OR code='$MERGE_FROM');

            INSERT OR IGNORE INTO assignment_type_qualifications (assignment_type_id, qualification_id, min_count)
              SELECT tq.assignment_type_id, (SELECT id FROM qualifications WHERE id='$MERGE_INTO' OR code='$MERGE_INTO'),
                     tq.min_count
                FROM assignment_type_qualifications tq
               WHERE tq.qualification_id = (SELECT id FROM qualifications WHERE id='$MERGE_FROM' OR code='$MERGE_FROM');

            INSERT OR IGNORE INTO assignment_type_exclusions (assignment_type_id, qualification_id)
              SELECT te.assignment_type_id, (SELECT id FROM qualifications WHERE id='$MERGE_INTO' OR code='$MERGE_INTO')
                FROM assignment_type_exclusions te
               WHERE te.qualification_id = (SELECT id FROM qualifications WHERE id='$MERGE_FROM' OR code='$MERGE_FROM');

            UPDATE OR IGNORE assignment_personnel
               SET role_qualification_id = (SELECT id FROM qualifications WHERE id='$MERGE_INTO' OR code='$MERGE_INTO')
             WHERE role_qualification_id = (SELECT id FROM qualifications WHERE id='$MERGE_FROM' OR code='$MERGE_FROM');"

      # A seat the survivor already held on the same shift is refused by the
      # partial unique index, and UPDATE OR IGNORE leaves it pointing at the
      # retired mark. Clearing it leaves the person on the shift as a לוחם,
      # which is the same answer crew-roles.yml gives.
      - name: Clear any seat the move could not carry
        if: ${{ inputs.merge_from != '' }}
        run: |
          npx wrangler d1 execute "$DATABASE_NAME" --remote --command "
            UPDATE assignment_personnel SET role_qualification_id = NULL
             WHERE role_qualification_id = (SELECT id FROM qualifications WHERE id='$MERGE_FROM' OR code='$MERGE_FROM');

            DELETE FROM personnel_qualifications
             WHERE qualification_id = (SELECT id FROM qualifications WHERE id='$MERGE_FROM' OR code='$MERGE_FROM');
            DELETE FROM assignment_type_qualifications
             WHERE qualification_id = (SELECT id FROM qualifications WHERE id='$MERGE_FROM' OR code='$MERGE_FROM');
            DELETE FROM assignment_type_exclusions
             WHERE qualification_id = (SELECT id FROM qualifications WHERE id='$MERGE_FROM' OR code='$MERGE_FROM');

            DELETE FROM qualifications
             WHERE id='$MERGE_FROM' OR code='$MERGE_FROM';"

      - name: What the list looks like now
        if: ${{ inputs.merge_from != '' }}
        run: |
          npx wrangler d1 execute "$DATABASE_NAME" --remote --command "
            SELECT q.code, q.name,
                   (SELECT COUNT(*) FROM personnel_qualifications pq
                     WHERE pq.qualification_id = q.id) AS held_by
              FROM qualifications q ORDER BY q.name;"
