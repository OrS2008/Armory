name = "shabatzak"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# The database_id below is a placeholder. Provision a dedicated D1 database
# ("wrangler d1 create shabatzak") and replace it before deploying.
# See docs/12-deployment-plan.md.
[[d1_databases]]
binding = "DB"
database_name = "shabatzak"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
