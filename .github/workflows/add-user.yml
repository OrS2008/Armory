name: Add a user account

# The screen at הגדרות ← משתמשים is the way to do this. This is the way when
# that is failing and somebody still has to be able to sign in.
#
# The password is not an input here and never reaches GitHub: it is turned into
# a salt and a hash wherever the operator runs the one-line command below, and
# only those two travel. A workflow's inputs are kept in the run's record, and a
# password that outlives the moment it was set is worse than an outage.
#
#   node -e "const c=require('node:crypto');const s=c.randomBytes(16).toString('hex');
#   console.log('salt='+s,'hash='+c.pbkdf2Sync(process.argv[1],Buffer.from(s,'utf8'),10000,32,'sha256').toString('hex'))" 'THE PASSWORD'
on:
  workflow_dispatch:
    inputs:
      user_name:
        description: Sign-in name — letters, digits, . _ - or an email address
        type: string
        required: true
      display_name:
        description: The name shown in the app
        type: string
        required: true
      role:
        description: Permission level
        type: choice
        options:
          - unit_scheduler
          - company_commander
          - system_admin
          - soldier
          - viewer
        default: unit_scheduler
      salt:
        description: 32 hex characters, from the command above
        type: string
        required: true
      hash:
        description: 64 hex characters, from the command above
        type: string
        required: true
      iterations:
        description: PBKDF2 count the hash was derived with
        type: string
        default: '10000'
      person:
        description: Link to this person by name, exactly as the roster spells it. Empty for none.
        type: string
        default: ''
      apply:
        description: Write the account. Leave off to report what it would do.
        type: boolean
        default: false
      database_name:
        description: D1 database name
        type: string
        default: shabatzak

concurrency:
  group: add-user
  cancel-in-progress: false

jobs:
  add:
    name: Report, then add
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: ${{ inputs.database_name }}
      USER_NAME: ${{ inputs.user_name }}
      DISPLAY_NAME: ${{ inputs.display_name }}
      ROLE: ${{ inputs.role }}
      SALT: ${{ inputs.salt }}
      HASH: ${{ inputs.hash }}
      ITERATIONS: ${{ inputs.iterations }}
      PERSON: ${{ inputs.person }}
    steps:
      - name: Check that the credentials are present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings, Secrets and variables, Actions.'
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm clean-install

      # Whether the name is taken, and whether the person named can be found.
      # A link that silently matched nothing is an account that looks right and
      # shows the holder nobody's shifts.
      - name: What is there already
        run: |
          npx wrangler d1 execute "$DATABASE_NAME" --remote --command "
            SELECT (SELECT COUNT(*) FROM users WHERE email = '$USER_NAME') AS name_taken,
                   (SELECT COUNT(*) FROM users) AS accounts_now,
                   (SELECT COUNT(*) FROM personnel
                     WHERE display_name = '$PERSON' AND status = 'active') AS person_matches;"

      # The generator refuses a malformed salt, hash, role or name before any
      # of it reaches the database.
      - name: Check the account is well formed
        run: node scripts/user-sql.mjs > /tmp/user.sql

      - name: Add it
        if: ${{ inputs.apply }}
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --file=/tmp/user.sql

      - name: The accounts now
        if: ${{ inputs.apply }}
        run: |
          npx wrangler d1 execute "$DATABASE_NAME" --remote --command "
            SELECT u.email, u.display_name, u.role, u.active,
                   u.password_iterations AS iterations,
                   p.display_name AS linked_person
              FROM users u
              LEFT JOIN personnel p ON p.id = u.personnel_id
             ORDER BY u.created_at;"

      - name: Say that nothing was written
        if: ${{ !inputs.apply }}
        run: echo 'Report only. No account was added.' >> "$GITHUB_STEP_SUMMARY"
