name: Clear the schedule

# Start the board over.
#
# This removes shifts, not posts. The distinction is the whole point: the posts
# carry their crew sizes, their required qualifications and the marks they
# refuse, and re-entering those by hand is exactly the work somebody is trying
# to avoid when they say the schedule is a mess. Deleting the shifts leaves a
# clean board that "פריסת תקופה" refills in one press.
#
# Report-only unless CLEAR is typed back. The audit trail is untouched: it
# carries no foreign key precisely so it outlives what it describes.
on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Only shifts starting on or after this day (YYYY-MM-DD). Empty means from the beginning.'
        type: string
        default: ''
      to_date:
        description: 'Only shifts starting on or before this day (YYYY-MM-DD). Empty means to the end.'
        type: string
        default: ''
      post_name:
        description: "Only this post's shifts, by name (for example: עיט). Empty means every post."
        type: string
        default: ''
      confirm:
        description: Type CLEAR to go ahead. Leave empty to only report.
        type: string
        default: ''
      database_name:
        description: D1 database name
        type: string
        default: shabatzak

concurrency:
  group: clear-schedule
  cancel-in-progress: false

jobs:
  clear:
    name: Report, then clear
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: ${{ inputs.database_name }}
      FROM_DATE: ${{ inputs.from_date }}
      TO_DATE: ${{ inputs.to_date }}
      POST_NAME: ${{ inputs.post_name }}

    steps:
      - name: Check that the credentials are present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings, Secrets and variables, Actions. The token needs Account, D1, Edit.'
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm clean-install

      # A date is either empty or YYYY-MM-DD. Anything else stops the run rather
      # than being pasted into SQL. One post can be named instead of all of
      # them, which is what a single post laid out twice on two different
      # rhythms needs: clearing the board to fix one of nine is not a fix.
      - name: Build the range
        id: range
        run: |
          set -euo pipefail
          valid() { [ -z "$1" ] || printf '%s' "$1" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; }
          if ! valid "$FROM_DATE" || ! valid "$TO_DATE"; then
            echo '::error::Dates must be YYYY-MM-DD, or empty.'
            exit 1
          fi
          WHERE=""
          [ -n "$FROM_DATE" ] && WHERE="$WHERE AND date(start_at/1000,'unixepoch') >= '$FROM_DATE'"
          [ -n "$TO_DATE" ] && WHERE="$WHERE AND date(start_at/1000,'unixepoch') <= '$TO_DATE'"
          if [ -n "$POST_NAME" ]; then
            # wrangler cannot bind a parameter, so the one character that could
            # close the string literal early is doubled — how SQL escapes it.
            SAFE=${POST_NAME//\'/\'\'}
            WHERE="$WHERE AND assignment_type_id IN (SELECT id FROM assignment_types WHERE org_id = 'org_default' AND name = '$SAFE')"
          fi
          echo "where=$WHERE" >> "$GITHUB_OUTPUT"
          echo "Range: ${FROM_DATE:-beginning} to ${TO_DATE:-end}, post: ${POST_NAME:-all}" >> "$GITHUB_STEP_SUMMARY"

      # What is at stake, counted before anything is touched, broken down by post
      # so a surprise — a post with ten times the shifts it should have — is
      # visible rather than averaged away.
      - name: Count what is at stake
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DATABASE_NAME" --remote --json --command \
            "SELECT t.name,
                    COUNT(DISTINCT a.id) AS shifts,
                    COUNT(ap.id) AS staffed_seats,
                    MIN(date(a.start_at/1000,'unixepoch')) AS first_day,
                    MAX(date(a.start_at/1000,'unixepoch')) AS last_day
               FROM assignment_instances a
               JOIN assignment_types t ON t.id = a.assignment_type_id
               LEFT JOIN assignment_personnel ap ON ap.assignment_id = a.id
              WHERE a.org_id = 'org_default' ${{ steps.range.outputs.where }}
              GROUP BY t.name ORDER BY shifts DESC" \
            | tee counts.json
          {
            echo '### Shifts that would go'
            echo '```json'
            cat counts.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Every post, whether or not it carries shifts. A post renamed while its
      # old row stayed behind leaves the sheet showing an empty card under the
      # new name and hundreds of shifts under the old one, and no count of
      # shifts alone can show that: the row with none is the evidence.
      - name: List every post
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DATABASE_NAME" --remote --json --command \
            "SELECT t.id, t.name, t.active, t.standing, t.shift_hours, t.shift_start_hour,
                    t.sheet_column, t.priority,
                    (SELECT COUNT(*) FROM assignment_instances a
                      WHERE a.assignment_type_id = t.id) AS shifts
               FROM assignment_types t
              WHERE t.org_id = 'org_default'
              ORDER BY shifts DESC, t.name" \
            | tee posts.json
          {
            echo '### Every post'
            echo '```json'
            cat posts.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The handover times, per post, per day. A post that hands over three
      # times a day and shows six rows here has been laid out twice on two
      # rhythms, which is exactly what makes its card unreadable.
      - name: Show the rhythm each post is actually running
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DATABASE_NAME" --remote --json --command \
            "SELECT t.name,
                    strftime('%H:%M', a.start_at/1000, 'unixepoch', '+3 hours') AS starts_at,
                    COUNT(*) AS turns,
                    MIN(date(a.start_at/1000,'unixepoch')) AS first_day,
                    MAX(date(a.start_at/1000,'unixepoch')) AS last_day
               FROM assignment_instances a
               JOIN assignment_types t ON t.id = a.assignment_type_id
              WHERE a.org_id = 'org_default' ${{ steps.range.outputs.where }}
              GROUP BY t.name, starts_at ORDER BY t.name, starts_at" \
            | tee rhythm.json
          {
            echo '### Handover times per post'
            echo '```json'
            cat rhythm.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report only, because CLEAR was not typed
        if: ${{ inputs.confirm != 'CLEAR' }}
        run: |
          {
            echo ''
            echo '**Nothing was written.** Run again with `confirm` set to `CLEAR` to go ahead.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only the shifts. assignment_personnel and any replacement request hang
      # off a shift and cascade with it; the posts, the roster and the audit
      # trail are all left standing.
      - name: Clear
        if: ${{ inputs.confirm == 'CLEAR' }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DATABASE_NAME" --remote --command \
            "DELETE FROM assignment_instances
              WHERE org_id = 'org_default' ${{ steps.range.outputs.where }};"
          echo 'Schedule cleared.' >> "$GITHUB_STEP_SUMMARY"

      - name: Report what remains
        if: ${{ inputs.confirm == 'CLEAR' }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DATABASE_NAME" --remote --json --command \
            "SELECT (SELECT COUNT(*) FROM assignment_instances) AS shifts_left,
                    (SELECT COUNT(*) FROM assignment_personnel) AS seats_left,
                    (SELECT COUNT(*) FROM assignment_types WHERE org_id = 'org_default') AS posts,
                    (SELECT COUNT(*) FROM personnel WHERE org_id = 'org_default') AS people" \
            | tee remaining.json
          {
            echo '### What remains'
            echo '```json'
            cat remaining.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
