name: Set up the company posts

# The four standing posts, the יזומה type and the driver/commander
# qualifications. Run by hand: this writes company data, not schema, and it is
# the step the import depends on — a soldier cannot be marked נהג before the
# qualification row exists.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the file and the current counts, write nothing
        type: boolean
        default: false
      database_name:
        description: D1 database name
        type: string
        default: shabatzak

concurrency:
  group: setup-company
  cancel-in-progress: false

jobs:
  setup:
    name: Load the standing posts
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: ${{ inputs.database_name }}
    steps:
      - name: Check that the credentials are present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings, Secrets and variables, Actions. The token needs Account, D1, Edit.'
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm clean-install

      # The file replaces its own rows and touches nothing else, so the run log
      # showing exactly what will be applied is the whole review.
      - name: Show what will be applied
        run: |
          {
            echo '### scripts/setup-company.sql'
            echo '```sql'
            cat scripts/setup-company.sql
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: ${{ !inputs.dry_run }}
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --file=scripts/setup-company.sql

      - name: Report what is now defined
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DATABASE_NAME" --remote --json --command \
            "SELECT t.name, t.required_headcount,
                    (SELECT GROUP_CONCAT(q.name || ' x' || tq.min_count)
                       FROM assignment_type_qualifications tq
                       JOIN qualifications q ON q.id = tq.qualification_id
                      WHERE tq.assignment_type_id = t.id) AS requires
               FROM assignment_types t
              WHERE t.active = 1
              ORDER BY t.priority, t.name" | tee posts.json
          {
            echo '### Posts now defined'
            echo '```json'
            cat posts.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarise a dry run
        if: ${{ inputs.dry_run }}
        run: echo 'Dry run only. Nothing was written.' >> "$GITHUB_STEP_SUMMARY"
