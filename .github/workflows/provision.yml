name: Provision Cloudflare

# One-time setup, run by hand. Every step is safe to repeat: existing
# resources are detected and reused rather than recreated.
on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Cloudflare Pages project name
        type: string
        default: shabatzak
      database_name:
        description: D1 database name
        type: string
        default: shabatzak

concurrency:
  group: provision
  cancel-in-progress: false

jobs:
  provision:
    name: Create D1, create Pages project, migrate and deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ${{ inputs.project_name }}
      DATABASE_NAME: ${{ inputs.database_name }}
    steps:
      - name: Check that the credentials are present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Credentials are present."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm clean-install

      - name: Create the D1 database if it does not exist
        id: database
        run: |
          set -euo pipefail
          existing=$(npx wrangler d1 list --json 2>/dev/null \
            | jq -r --arg name "$DATABASE_NAME" '.[] | select(.name == $name) | (.uuid // .database_id)' \
            | head -n1)

          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            echo "Reusing the existing database."
          else
            echo "Creating $DATABASE_NAME…"
            npx wrangler d1 create "$DATABASE_NAME"
            existing=$(npx wrangler d1 list --json \
              | jq -r --arg name "$DATABASE_NAME" '.[] | select(.name == $name) | (.uuid // .database_id)' \
              | head -n1)
          fi

          if [ -z "$existing" ] || [ "$existing" = "null" ]; then
            echo '::error::Could not resolve the database id from wrangler d1 list --json; its output is above.'
            exit 1
          fi

          echo "database_id=$existing" >> "$GITHUB_OUTPUT"
          echo "### D1 database" >> "$GITHUB_STEP_SUMMARY"
          echo "$DATABASE_NAME -> $existing" >> "$GITHUB_STEP_SUMMARY"

      # The repository keeps a placeholder id so that no deploy can reach an
      # unintended database. The real id is substituted here, for this run only,
      # and is never committed.
      - name: Point wrangler.toml at the real database
        run: |
          set -euo pipefail
          sed -i "s/00000000-0000-0000-0000-000000000000/${{ steps.database.outputs.database_id }}/" wrangler.toml
          sed -i "s/^name = .*/name = \"$PROJECT_NAME\"/" wrangler.toml
          sed -i "s/^database_name = .*/database_name = \"$DATABASE_NAME\"/" wrangler.toml
          cat wrangler.toml

      - name: Create the Pages project if it does not exist
        run: |
          set -euo pipefail
          if npx wrangler pages project list 2>/dev/null | grep -qw "$PROJECT_NAME"; then
            echo "Reusing the existing Pages project."
          else
            npx wrangler pages project create "$PROJECT_NAME" --production-branch=main
          fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$DATABASE_NAME" --remote

      - name: Set the bootstrap administrator secrets
        env:
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$BOOTSTRAP_ADMIN_EMAIL" ] || [ -z "$BOOTSTRAP_ADMIN_PASSWORD" ]; then
            echo "::error::Add BOOTSTRAP_ADMIN_EMAIL and BOOTSTRAP_ADMIN_PASSWORD as repository secrets. Without them nobody can sign in."
            exit 1
          fi
          printf '%s' "$BOOTSTRAP_ADMIN_EMAIL" \
            | npx wrangler pages secret put BOOTSTRAP_ADMIN_EMAIL --project-name="$PROJECT_NAME"
          printf '%s' "$BOOTSTRAP_ADMIN_PASSWORD" \
            | npx wrangler pages secret put BOOTSTRAP_ADMIN_PASSWORD --project-name="$PROJECT_NAME"

      - name: Build
        run: npm run build

      - name: Deploy
        run: npx wrangler pages deploy dist --project-name="$PROJECT_NAME" --branch=main

      # Proves the deployment is actually wired to D1: /health runs a query.
      - name: Smoke test the deployment
        run: |
          set -euo pipefail
          url="https://$PROJECT_NAME.pages.dev/api/v1/health"
          echo "Probing $url"
          for attempt in $(seq 1 12); do
            body=$(curl -fsS --max-time 20 "$url" || true)
            if echo "$body" | grep -q '"status":"ready"'; then
              echo "Healthy: $body"
              {
                echo "### Deployment"
                echo "https://$PROJECT_NAME.pages.dev — healthy, database reachable."
                echo ""
                echo "Sign in at https://$PROJECT_NAME.pages.dev/login with the bootstrap"
                echo "credentials, then rotate them."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: not ready yet ($body)"
            sleep 10
          done
          echo "::error::The site did not report a healthy database. The D1 binding is the usual cause — check Workers & Pages → $PROJECT_NAME → Settings → Bindings for a D1 binding named DB."
          exit 1
