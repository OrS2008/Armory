name: Import personnel from the equipment system

# Copies the roster out of the equipment application's D1 database into this
# one. The source is only ever read: every statement written against it is a
# SELECT, and nothing in this workflow can modify it.
on:
  workflow_dispatch:
    inputs:
      source_database:
        description: D1 database of the equipment system — name or UUID
        type: string
        default: armory
      dry_run:
        description: Report what would be imported, write nothing
        type: boolean
        default: true
      include_phones:
        description: Bring phone numbers across
        type: boolean
        default: true
      map_military_licence_to_driver:
        description: Treat an approved military licence as the נהג qualification
        type: boolean
        default: true

concurrency:
  group: import-equipment
  cancel-in-progress: false

jobs:
  import:
    name: Read the equipment roster and load it
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE: ${{ inputs.source_database }}
    steps:
      - name: Check that the credentials are present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings, Secrets and variables, Actions.'
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm clean-install

      # "Couldn't find a D1 DB with name 'armory'" has two very different causes:
      # the database is gone, or this token cannot see it. Only the list tells
      # them apart, so it runs first and never fails the job by itself.
      - name: List the databases this token can see
        run: |
          npx wrangler d1 list --json > databases.json 2>&1 || true
          cat databases.json
          {
            echo '### D1 databases visible to this token'
            echo '```json'
            cat databases.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Read-only, and printed before the roster query so a failure below can be
      # read against the schema that actually exists rather than guessed at.
      - name: Describe the source database
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$SOURCE" --remote --json --command \
            "SELECT name FROM sqlite_master WHERE type = 'table' ORDER BY name" | tee tables.json
          {
            echo '### Tables in the source database'
            echo '```json'
            cat tables.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Read-only. Approved, non-archived soldiers, and only the columns
      # scheduling needs; a current military licence becomes the driver flag.
      #
      # wrangler --json writes its errors to stdout, which the redirect below
      # captures — so a failure has to be re-printed by hand or the run log
      # shows nothing but "exit code 1".
      - name: Read the equipment roster
        run: |
          set -uo pipefail
          npx wrangler d1 execute "$SOURCE" --remote --json --command "
            SELECT s.full_name,
                   s.personal_id,
                   s.phone,
                   d.name AS department_name,
                   CASE WHEN EXISTS (
                     SELECT 1 FROM licenses l
                      WHERE l.soldier_id = s.id
                        AND l.type = 'military'
                        AND l.status = 'approved'
                        AND (l.expires_at IS NULL OR l.expires_at > strftime('%s','now') * 1000)
                   ) THEN 1 ELSE 0 END AS has_military_licence
              FROM soldiers s
              LEFT JOIN departments d ON d.id = s.department_id
             WHERE s.approval_status = 'approved'
             ORDER BY s.full_name
          " > roster.json
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '::error::Could not read the equipment roster. wrangler said:'
            cat roster.json
            exit "$status"
          fi

      - name: Build the import
        run: |
          set -euo pipefail
          node scripts/import-from-equipment.mjs \
            --input=roster.json \
            --phones=${{ inputs.include_phones }} \
            --drivers=${{ inputs.map_military_licence_to_driver }} \
            > import.sql 2> summary.txt
          cat summary.txt
          {
            echo '### Equipment roster'
            echo '```'
            cat summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'First few statements:'
          head -n 6 import.sql

      - name: Load into SHABATZAK
        if: ${{ !inputs.dry_run }}
        run: npx wrangler d1 execute shabatzak --remote --file=import.sql

      - name: Count what is now in place
        if: ${{ !inputs.dry_run }}
        run: |
          npx wrangler d1 execute shabatzak --remote --json --command \
            "SELECT COUNT(*) AS personnel FROM personnel WHERE status = 'active'"

      - name: Summarise a dry run
        if: ${{ inputs.dry_run }}
        run: echo 'Dry run only. Nothing was written.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: equipment-import
          path: |
            import.sql
            summary.txt
          retention-days: 3
