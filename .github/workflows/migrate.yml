name: Apply D1 migrations

# Run by hand only. Cloudflare's build never applies migrations, and a schema
# change should be a deliberate act rather than a side effect of a push.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what is pending, apply nothing
        type: boolean
        default: false
      database_name:
        description: D1 database name
        type: string
        default: shabatzak
      site_host:
        description: Host to verify afterwards
        type: string
        default: shabatzak.pages.dev

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: List, apply and verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: ${{ inputs.database_name }}
      SITE_HOST: ${{ inputs.site_host }}
    steps:
      - name: Check that the credentials are present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings, Secrets and variables, Actions. The token needs Account, D1, Edit.'
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm clean-install

      # Printed before anything is applied, so the run log records what changed.
      - name: List pending migrations
        run: npx wrangler d1 migrations list "$DATABASE_NAME" --remote

      - name: Apply migrations
        if: ${{ !inputs.dry_run }}
        run: npx wrangler d1 migrations apply "$DATABASE_NAME" --remote

      # /health reports the schema separately from the binding, so this proves
      # the live site can actually serve requests rather than that a command
      # exited zero.
      - name: Verify the live schema
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          url="https://$SITE_HOST/api/v1/health"
          for attempt in $(seq 1 6); do
            body=$(curl -fsS --max-time 20 "$url" || true)
            echo "Attempt $attempt: $body"
            if echo "$body" | grep -q '"schema":"ready"'; then
              echo "Schema is live." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The site still does not report a ready schema. If it reports database unreachable, the binding or the database_id in wrangler.toml is wrong; the migrations themselves may still have applied."
          exit 1

      - name: Summarise a dry run
        if: ${{ inputs.dry_run }}
        run: echo 'Dry run only. Nothing was applied.' >> "$GITHUB_STEP_SUMMARY"
